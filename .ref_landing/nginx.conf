worker_processes 2;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    server {
        listen 8080;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /health {
            access_log off;
            return 200 '{"status":"UP","service":"orchestreeai-admin-dashboard"}';
            add_header Content-Type application/json;
        }

        # Security headers (Fase 124 Bagian C & G)
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self' https: data:; script-src 'self'; object-src 'none'; base-uri 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' https: wss:; font-src 'self' https: data:;" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    }
}

