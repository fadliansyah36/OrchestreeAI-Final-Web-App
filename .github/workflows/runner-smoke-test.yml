name: Runner Smoke Test
run-name: Runner Smoke Test — Post Ownership Transfer
on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  smoke-test:
    name: Minimal GitHub Hosted Runner Test — Post Transfer
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Runner OK
        run: echo "RUNNER_OK_POST_TRANSFER"

      - name: Environment OK
        run: |
          echo "OS: $(uname -srm)"
          echo "Runner: $RUNNER_NAME"
          echo "Temp: $RUNNER_TEMP"
